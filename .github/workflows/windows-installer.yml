name: Windows installer

# Builds the one-click Windows installer (setup.exe) and a portable zip on a
# real Windows runner, verifies the frozen executable, and — on a tag — uploads
# both artefacts to the GitHub Release so there is a stable download link.
#
# Everything runs through the repository's own pipeline
# (scripts/package/release.py), so CI and a developer's `build_windows.bat`
# exercise the exact same code path.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build & verify (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Keep Qt/pyqtgraph head-less-safe in case any step touches a widget.
      QT_QPA_PLATFORM: offscreen
      # One place for the pinned toolchain; matches requirements-build.txt.
      PYTHONUTF8: "1"
      # The app prints non-ASCII ("·" in --version); keep piped output UTF-8 so
      # no step trips over the Windows ANSI code page.
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install the pinned toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Quality gate (lint + types)
        run: |
          python -m ruff check app run.py tests scripts
          python -m mypy app

      - name: Test suite
        run: python -m pytest -q

      - name: Build the frozen bundle and verify it
        # --skip-tests: the suite already ran above, no need to pay for it twice.
        run: python scripts/package/release.py --release --skip-installer --skip-tests

      - name: Install Inno Setup 6
        # A per-machine install puts ISCC.exe where common.find_iscc() looks.
        run: |
          choco install innosetup --no-progress -y

      - name: Compile the one-click installer
        run: python scripts/installer/build_installer.py --release

      - name: Assemble the delivery package
        run: python scripts/package/deliver.py --release

      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "build/installer/SmartCoolingController-*-setup.exe" out/
          Copy-Item "build/delivery/*.zip" out/
          Copy-Item "build/installer/installer-manifest.json" out/ -ErrorAction SilentlyContinue
          Copy-Item "build/delivery/checksums.sha256" out/ -ErrorAction SilentlyContinue
          Get-ChildItem out | Format-Table Name, Length

      - name: Verify the installer is in the checksums file
        shell: pwsh
        run: |
          # RELEASE_NOTES.md tells the user to verify the setup.exe against
          # checksums.sha256.  v2.0.0 shipped that file without the installer,
          # so the verification was impossible; fail the release if a future
          # change reintroduces the omission.
          $checksums = Get-Content "out/checksums.sha256" -Raw
          if ($checksums -notmatch 'SmartCoolingController-.*-setup\.exe') {
            throw "checksums.sha256 does not list the setup.exe"
          }
          $installer = Get-ChildItem "out/SmartCoolingController-*-setup.exe" | Select-Object -First 1
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          if ($checksums -notmatch [regex]::Escape($digest)) {
            throw "checksums.sha256 does not contain the installer's real digest"
          }
          Write-Host "checksums.sha256 lists the installer with the correct digest."

      - name: Upload the installer and portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartcooling-windows
          path: out/*
          if-no-files-found: error

      - name: Attach artefacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          # Keep the hand-written download/verify guide, then append the
          # generated commit list so each release explains how to install.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
